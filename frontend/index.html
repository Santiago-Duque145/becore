<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1420" />
    <meta name="description" content="Be Core: tu comunidad en movimiento. Encuentra y organiza eventos deportivos y culturales de tu barrio." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Be Core" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <title>Be Core</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- P7 · Arranque: mientras se descarga el JS, el isotipo aparece a los 300 ms (sin parpadeo si carga rápido).
         React lo reemplaza al montar. Autocontenido: colores de la skill §1, sin Tailwind. -->
    <style>
      .boot { min-height: 100dvh; display: grid; place-items: center; background: #0b1420; }
      .boot svg { opacity: 0; animation: boot-in 200ms ease-out 300ms forwards, boot-breathe 1.8s ease-in-out 500ms infinite; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-breathe { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.75; transform: scale(0.94); } }
      @media (prefers-reduced-motion: reduce) { .boot svg { animation: boot-in 0s linear 300ms forwards; } }
    </style>
    <div id="root">
      <div class="boot" role="status" aria-label="Cargando">
        <svg width="72" height="72" viewBox="0 0 34 34" fill="none" aria-hidden="true">
          <rect width="34" height="34" rx="9" fill="#0D1B2A" />
          <path d="M10 24 L10 10 Q10 8 12 8 L18 8 Q23 8 23 12.5 Q23 16 19 17 Q24 18 24 22.5 Q24 27 18 27 L12 27 Q10 27 10 25 Z" fill="url(#boot-gradient)" />
          <defs>
            <linearGradient id="boot-gradient" x1="10" y1="8" x2="24" y2="27" gradientUnits="userSpaceOnUse">
              <stop stop-color="#14B8A6" />
              <stop offset="1" stop-color="white" />
            </linearGradient>
          </defs>
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
